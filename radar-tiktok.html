<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Radar Entrebell · conectando TikTok</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f8fb;color:#20262a;text-align:center;padding:24px}
  a{color:#0089dd;font-weight:600}
</style>
</head>
<body>
<main>
  <p><b>Conectando TikTok con Radar Entrebell…</b></p>
  <p>Si no pasa nada en unos segundos, <a id="go" href="#">toca aquí</a>.</p>
</main>
<script>
  /* Página puente: recibe la respuesta de TikTok y la pasa completa al panel de Apps Script. */
  var PANEL = "https://script.google.com/macros/s/AKfycbwgiGepkO984pgFk_0pDxCfjOC4hKTWLVnDMcOkdX57jbaTOf0dp5-p8DP-It_Mg0IhXQ/exec";
  var destino = PANEL + window.location.search;
  document.getElementById("go").href = destino;
  window.location.replace(destino);
</script>
</body>
